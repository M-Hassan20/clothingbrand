<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #28a745;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 30px 20px;
            background-color: #f9f9f9;
        }
        .order-info {
            background-color: #fff;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #28a745;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #28a745;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>🎉 New Order Received!</h1>
</div>

<div class="content">
    <p>Hello Admin,</p>

    <p>A new order has been placed on Haus of Hafsah!</p>

    <div class="order-info">
        <p><strong>Order ID:</strong> #<span th:text="${orderId}">12345</span></p>
        <p><strong>Customer:</strong> <span th:text="${customerEmail}">customer@email.com</span></p>
        <p><strong>Order Total:</strong> $<span th:text="${orderTotal}">0.00</span></p>
    </div>

    <a th:href="${orderUrl}" class="button">View Order Details</a>
</div>
</body>
</html>
