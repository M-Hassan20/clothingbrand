<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Order Alert - Haus of Hafsah Admin</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAF7F2;
            color: #2B2622;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            width: 100%;
            background-color: #FAF7F2;
            padding: 40px 15px;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #FFFFFF;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #E8DFD3;
            box-shadow: 0 4px 16px rgba(43, 38, 34, 0.04);
        }
        .header {
            background-color: #2B2622;
            padding: 32px 20px;
            text-align: center;
        }
        .brand-title {
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            color: #FAF7F2;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 0;
            text-transform: uppercase;
        }
        .brand-subtitle {
            color: #B08968;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 6px;
        }
        .banner {
            background-color: #F4F7F4;
            border-bottom: 1px solid #E8DFD3;
            padding: 18px 20px;
            text-align: center;
        }
        .banner-title {
            font-family: 'Playfair Display', Georgia, serif;
            color: #5C7A5C;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        .content {
            padding: 36px 32px;
        }
        .greeting {
            font-size: 16px;
            font-weight: 600;
            color: #2B2622;
            margin-bottom: 16px;
        }
        .message {
            font-size: 14px;
            color: #4A423A;
            margin-bottom: 24px;
        }
        .order-card {
            background-color: #FAF7F2;
            border: 1px solid #E8DFD3;
            border-left: 4px solid #5C7A5C;
            border-radius: 6px;
            padding: 20px 24px;
            margin: 24px 0;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .summary-row:last-child {
            margin-bottom: 0;
        }
        .summary-label {
            color: #8A7B6C;
        }
        .summary-value {
            color: #2B2622;
            font-weight: 600;
        }
        .cta-container {
            text-align: center;
            margin: 32px 0 24px 0;
        }
        .button {
            display: inline-block;
            padding: 14px 36px;
            background-color: #B08968;
            color: #FFFFFF !important;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(176, 137, 104, 0.25);
            transition: background-color 0.2s ease;
        }
        .footer {
            background-color: #FAF7F2;
            border-top: 1px solid #E8DFD3;
            padding: 24px 20px;
            text-align: center;
            font-size: 12px;
            color: #8A7B6C;
        }
        .footer p {
            margin: 4px 0;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="container">
        <div class="header">
            <h1 class="brand-title">Haus of Hafsah</h1>
            <div class="brand-subtitle">Admin Control Portal</div>
        </div>

        <div class="banner">
            <h2 class="banner-title">🎉 New Customer Order Placed</h2>
        </div>

        <div class="content">
            <p class="greeting">Hello Admin,</p>

            <p class="message">A new checkout order has been placed on the storefront!</p>

            <div class="order-card">
                <div class="summary-row">
                    <span class="summary-label">Order ID:</span>
                    <span class="summary-value">#<span th:text="${orderId}">12345</span></span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Customer Email:</span>
                    <span class="summary-value"><span th:text="${customerEmail}">customer@email.com</span></span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Order Total:</span>
                    <span class="summary-value">Rs. <span th:text="${orderTotal}">0.00</span></span>
                </div>
            </div>

            <div class="cta-container">
                <a th:href="${orderUrl}" class="button">View Order Details</a>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 Haus of Hafsah Admin Management</p>
        </div>
    </div>
</div>
</body>
</html>
