<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #ffc107;
            color: #000;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 30px 20px;
            background-color: #f9f9f9;
        }
        .alert {
            background-color: #fff3cd;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #ffc107;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>⚠️ Low Stock Alert</h1>
</div>

<div class="content">
    <p>Hello Admin,</p>

    <div class="alert">
        <p><strong>Product:</strong> <span th:text="${productName}">Product Name</span></p>
        <p><strong>Current Stock:</strong> <span th:text="${currentStock}">0</span> units</p>
    </div>

    <p>Please restock this product soon to avoid running out.</p>
</div>
</body>
</html>
