<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status Update - Haus of Hafsah</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #FBF9F5;
            color: #1C1917;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            width: 100%;
            background-color: #FBF9F5;
            padding: 40px 15px;
            box-sizing: border-box;
        }
        .container {
            max-width: 580px;
            margin: 0 auto;
            background-color: #FFFFFF;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #E7E5E4;
            box-shadow: 0 4px 20px rgba(28, 25, 23, 0.03);
        }
        .header {
            background-color: #1C1917;
            padding: 36px 20px;
            text-align: center;
        }
        .brand-title {
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
            color: #FBF9F5;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            margin: 0;
            text-transform: uppercase;
        }
        .brand-subtitle {
            color: #8C6D53;
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 500;
        }
        .content {
            padding: 40px 36px;
        }
        .greeting {
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
            font-size: 22px;
            font-weight: 600;
            color: #1C1917;
            margin: 0 0 12px 0;
        }
        .message {
            font-size: 14px;
            color: #44403C;
            margin-bottom: 24px;
        }
        .info-card {
            background-color: #F4EFEA;
            border: 1px solid #E7E5E4;
            border-radius: 4px;
            padding: 24px;
            margin: 24px 0;
        }
        .info-row {
            margin-bottom: 12px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-label {
            color: #78716C;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 1px;
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }
        .info-value {
            color: #1C1917;
            font-weight: 600;
            font-size: 14px;
        }
        .status-pill {
            display: inline-block;
            background-color: #1C1917;
            color: #FBF9F5;
            padding: 6px 16px;
            border-radius: 2px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .cta-container {
            text-align: center;
            margin: 32px 0 16px 0;
        }
        .button {
            display: inline-block;
            padding: 14px 36px;
            background-color: #1C1917;
            color: #FBF9F5 !important;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 2px;
        }
        .footer {
            background-color: #FBF9F5;
            border-top: 1px solid #E7E5E4;
            padding: 28px;
            text-align: center;
            font-size: 11px;
            color: #78716C;
        }
        .footer-links a {
            color: #8C6D53;
            text-decoration: none;
            margin: 0 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <h1 class="brand-title">HAUS OF HAFSAH</h1>
                <div class="brand-subtitle">SHIPMENT STATUS NOTIFICATION</div>
            </div>

            <div class="content">
                <h2 class="greeting" th:text="'Hello, ' + ${userName}">Hello</h2>
                
                <p class="message">
                    The status of your order #<strong th:text="${orderId}">1001</strong> has been updated.
                </p>

                <div class="info-card" style="text-align: center;">
                    <span class="info-label">Current Order Status</span>
                    <div>
                        <span class="status-pill" th:text="${status}">SHIPPED</span>
                    </div>
                </div>

                <div class="cta-container">
                    <a th:href="${orderUrl}" class="button">Track Your Order</a>
                </div>
            </div>

            <div class="footer">
                <div>&copy; Haus of Hafsah • Client Care Services</div>
                <div class="footer-links" style="margin-top: 10px;">
                    <a href="https://hausofhafsah.com/account/orders">My Orders</a> •
                    <a href="mailto:support@hausofhafsah.com">Support</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
