<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 30px 20px;
            background-color: #f9f9f9;
        }
        .status-update {
            background-color: #fff;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #28a745;
            text-align: center;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>Order Status Update</h1>
</div>

<div class="content">
    <p>Hi <span th:text="${userName}">User</span>,</p>

    <p>Your order has been updated!</p>

    <div class="status-update">
        <h2>Order #<span th:text="${orderId}">12345</span></h2>
        <p><strong>Status:</strong> <span th:text="${status}">Shipped</span></p>
    </div>

    <a th:href="${orderUrl}" class="button">Track Your Order</a>

    <p>Best regards,<br>The Haus of Hafsah Team</p>
</div>

<div class="footer">
    <p>&copy; 2026 Haus of Hafsah. All rights reserved.</p>
</div>
</body>
</html>
