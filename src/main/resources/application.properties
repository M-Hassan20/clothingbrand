spring.application.name=HausOfHafsah

# MySQL
spring.datasource.url=jdbc:mysql://clothing-mysql:${DB_PORT:3306}/${DB_NAME:clothing}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Hassan@nov20}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Firebase Storage
firebase.storage.bucket=your-project-id.appspot.com
firebase.storage.base-url=https://firebasestorage.googleapis.com/v0/b/${firebase.storage.bucket}/o/

# Image Upload Settings
image.max-size=10485760
image.allowed-formats=jpg,jpeg,png,webp
image.thumbnail-size=300
image.medium-size=800
image.large-size=1200

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_ADDRESS}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Email Settings
app.email.from=hausofhafsa@gmail.com
app.email.from-name=Haus of Hafsah
app.email.admin=hausofhafsa@gmail.com

# Company Information (for invoices)
company.name=Haus of Hafsah
company.address=No Physical Location yet
company.phone=+92-314-8730683
company.email=hausofhafsa.com
company.website=www.hausofhafsah.com
company.tax-id=TAX-123456789

# JazzCash Payment Gateway
# Sandbox URLs (switch to production URLs when going live)
# Cloudinary Config for Images
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Storefront Cache Revalidation Configuration
storefront.revalidate.url=${STOREFRONT_REVALIDATE_URL:http://host.docker.internal:3000/api/revalidate}
storefront.revalidate.secret=${STOREFRONT_REVALIDATE_SECRET:local-secret-key}

# Response Compression Configuration
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# SafePay Configuration
safepay.secret-key=${SAFEPAY_SECRET_KEY}
safepay.merchant-api-key=${SAFEPAY_MERCHANT_API_KEY}
safepay.webhook-secret=${SAFEPAY_WEBHOOK_SECRET}
safepay.sandbox.mode=true
safepay.sandbox.api-url=https://sandbox.api.getsafepay.com
safepay.production.api-url=https://api.getsafepay.com
safepay.redirect-url=http://localhost:3000/payment/success
safepay.cancel-url=http://localhost:3000/payment/cancel
safepay.currency=PKR