services:
  # Backend Web Service
  - type: web
    name: hausofhafsah-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: JAVA_OPTS
        value: "-Dserver.port=10000"
      - key: PORT
        value: 10000
      - key: SPRING_REDIS_HOST
        fromService:
          type: redis
          name: hausofhafsah-redis
          property: host
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SAFEPAY_SECRET_KEY
        sync: false
      - key: SAFEPAY_MERCHANT_API_KEY
        sync: false
      - key: SAFEPAY_WEBHOOK_SECRET
        sync: false

  # Redis Cache Instance
  - type: redis
    name: hausofhafsah-redis
    plan: free
    ipAllowList: []

