services:
  redis:
    image: redis:7-alpine
    container_name: clothing_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: clothing-backend
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "8080:8080"

volumes:
  redis_data: